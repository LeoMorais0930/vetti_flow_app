name: vetti_flow_app
description: VETTI Flow — App do Gestor
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP e SignalR
  http: ^1.2.0
  signalr_netcore: ^1.3.4   # cliente SignalR para Flutter

  # UX
  shared_preferences: ^2.2.3  # guarda deviceId e IP do servidor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
