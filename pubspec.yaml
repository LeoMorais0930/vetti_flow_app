name: vetti_flow_app
description: VETTI Flow — App do Gestor
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP e SignalR
  http: ^1.2.0
  signalr_netcore: ^1.3.4   # cliente SignalR para Flutter

  # UX
  shared_preferences: ^2.2.3  # guarda deviceId e IP do servidor
  flutter_displaymode: ^0.7.0 # Alta taxa de atualização (FPS)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "web/icons/Icon-512.png"
  web:
    generate: true
    image_path: "web/icons/Icon-512.png"
  windows:
    generate: false

flutter:
  uses-material-design: true
